[build-system]
requires=["setuptools>=61.0"]
build-backend="setuptools.build_meta"

[project]
name="AgenTalk"
version="0.9.0"
description="Foundation module for autonomous AI agents."
authors=[{name="Koji Iigura",email="koji.iigura@gmail.com"}]
readme="README.md"
license={text="MIT"}
requires-python=">=3.11"

[project.scripts]
agt="AgenTalk.cmd.agt:main"

[tool.setuptools]
package-dir={"" = "src"}

[tool.setuptools.packages.find]
where=["src"]

